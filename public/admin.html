<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VYOMA Staff Panel</title><link rel="stylesheet" href="/style.css"></head><body><header class="nav"><a class="brand" href="/">VYOMA<span>RP</span></a><a href="/">Kembali ke website</a></header><main class="section"><p class="eyebrow">RESTRICTED ACCESS</p><h2>Staff <em>Dashboard</em></h2><form id="login"><label>Username<input name="username" required></label><label>Password<input name="password" type="password" required></label><button class="button primary">Login</button><p id="msg"></p></form><div id="applications"></div></main><script>
const msg=document.querySelector("#msg"), list=document.querySelector("#applications");
async function load(){const r=await fetch("/api/admin/applications");if(!r.ok){msg.textContent="Login terlebih dahulu.";return;}const rows=await r.json();list.innerHTML=rows.map(x=>`<article class="cards" style="display:block;margin:18px 0;padding:20px;background:#171323"><b>#${x.id} · ${x.status}</b><h3>${esc(x.username)} — ${esc(x.discord)}</h3><p>${esc(x.reason)}</p><small>${esc(x.created_at)}</small><p><button onclick="setStatus(${x.id},'Approved')">Approve</button> <button onclick="setStatus(${x.id},'Rejected')">Reject</button> <button onclick="setStatus(${x.id},'Pending')">Pending</button></p></article>`).join("")||"Belum ada pendaftaran."}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
window.setStatus=async(id,status)=>{await fetch("/api/admin/applications/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status})});load()};
document.querySelector("#login").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget));const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});const x=await r.json();msg.textContent=x.error||"Login berhasil";if(r.ok)load()};
</script></body></html>
